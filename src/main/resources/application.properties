## Spring DevTools の設定
## 自動再起動を有効にします
#spring.devtools.restart.enabled=true
#
## データソース設定
## MySQL データベース接続の設定
#spring.datasource.url=jdbc:mysql://localhost:3306/testdb?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true
#spring.datasource.username=testuser
#spring.datasource.password=test
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
## HikariCP 設定（デフォルトの接続プール）
## 最大接続プールサイズを設定
#spring.datasource.hikari.maximum-pool-size=10
## 最小アイドル接続数を設定
#spring.datasource.hikari.minimum-idle=5
## 接続がアイドル状態でいる最大時間を設定（ミリ秒）
#spring.datasource.hikari.idle-timeout=30000
## 接続取得のタイムアウト時間を設定（ミリ秒）
#spring.datasource.hikari.connection-timeout=30000
## 接続の最大寿命を設定（ミリ秒）
#spring.datasource.hikari.max-lifetime=600000
#
## サーバーポートの設定
## アプリケーションが動作するポート番号を指定
#server.port=8080
#
## MyBatis の設定
## MyBatis のマッパー XML ファイルの場所を指定
#mybatis.mapper-locations=classpath:mapper/*.xml
## MyBatis の型エイリアス用のパッケージを指定
#mybatis.type-aliases-package=com.kyh.system.model
#
## PageHelper の設定（ページネーション）
## 使用するデータベースの方言（MySQL）を設定
#pagehelper.helperDialect=mysql
## 範囲チェックを有効にするかを設定（true: 有効）
#pagehelper.reasonable=true
## メソッド引数として PageHelper をサポートするかを設定
#pagehelper.supportMethodsArguments=true
## COUNT クエリのパラメータ名を設定
#pagehelper.params=count=countSql


#===========================================
 Spring DevTools の設定
spring.devtools.restart.enabled=true

# データソース設定 (PostgreSQL 17)
# 文書記載の接続情報: ポート5432, DB名testdb, パスワードpostgres
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP 設定
# PostgreSQLはisValid()が正常動作するためconnection-test-queryは不要
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# サーバーポート設定
server.port=8080

# MyBatis 設定
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kyh.system.model

# PageHelper 設定 (PostgreSQLに変更)
pagehelper.helperDialect=postgresql
pagehelper.reasonable=true
pagehelper.supportMethodsArguments=true
pagehelper.params=count=countSql

# 日付形式 (テキストボックスから YYYY-MM-DD 入力をバインドするため)
spring.mvc.format.date=yyyy-MM-dd

# DEBUG
logging.level.com.kyh.system.mapper=DEBUG