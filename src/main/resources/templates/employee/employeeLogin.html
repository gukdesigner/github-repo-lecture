<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン画面</title>
<link rel="stylesheet" th:href="@{/employee/employee.css}">
</head>
<body>
<div class="login-box">
    <h3>ログインフォーム</h3>
    <hr>

    <p th:if="${error}" th:text="${error}" class="message-error"></p>

    <form th:action="@{/login}" method="post">
        <label>ユーザーID：
            <input type="text" name="userCode" size="15" required>
        </label>
        <br>
        <label for="pass">パスワード： </label>
        <input id="pass" type="password" name="password" size="15" required>

        <br><br>
        <input type="submit" value="ログイン">
    </form>
</div>
</body>
</html>
